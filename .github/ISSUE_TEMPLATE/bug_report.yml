name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I click X, Y happens instead of Z."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to /explorer
        2. Enter query '...'
        3. Click Send
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Query Builder
        - Response Viewer
        - AI Query Builder
        - Code Snippets
        - Permissions / Consent
        - Resource Explorer
        - Sidebar / Samples / History
        - Authentication
        - Landing Page
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, cloud environment
      placeholder: "Chrome 126, macOS, Global cloud"
    validations:
      required: false
